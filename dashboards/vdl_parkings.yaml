# VDL Parkings dashboard starter.
# Replace the example entity IDs with those created by your HA entity registry.
# For long-term graphs, Recorder must be enabled and the occupancy sensors
# must remain available long enough to build statistics.
title: VDL Parkings
views:
  - title: Overview
    path: vdl-parkings
    icon: mdi:parking
    cards:
      - type: entities
        title: API health
        entities:
          - binary_sensor.vdl_parkings_api_reachable
          - sensor.vdl_parkings_api_last_successful_api_response
          - sensor.vdl_parkings_api_api_consecutive_failures
      - type: glance
        title: Example parking status
        entities:
          - entity: sensor.vdl_parking_27_available_spaces
            name: Bouillon – free
          - entity: sensor.vdl_parking_27_occupancy_rate
            name: Bouillon – occupancy
          - entity: binary_sensor.vdl_parking_27_open
            name: Open
          - entity: binary_sensor.vdl_parking_27_full
            name: Full
      - type: history-graph
        title: Occupancy – last 24 hours
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - sensor.vdl_parking_27_occupancy_rate
          - sensor.vdl_parking_8_occupancy_rate
      - type: statistics-graph
        title: Occupancy – long-term trend
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
          - min
          - max
        entities:
          - sensor.vdl_parking_27_occupancy_rate
          - sensor.vdl_parking_8_occupancy_rate
