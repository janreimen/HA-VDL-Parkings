
title: VDL Parkings
views:
  - title: Parkings
    path: vdl-parkings
    icon: mdi:parking
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              # VDL Parkings

              Live-Übersicht der ausgewählten Parkhäuser in Luxemburg.

              Die Verfügbarkeit wird durch die VDL-Parkings-Integration aktualisiert.

          - type: custom:vdl-parkings-card
            title: Parkhäuser
            show_status: true
            show_occupancy: true

      - type: grid
        cards:
          - type: heading
            heading: API-Status
            heading_style: title

          - type: entities
            title: VDL API diagnostics
            show_header_toggle: false
            entities:
              - entity: sensor.vdl_parkings_api_last_success
                name: Last successful API response
              - entity: sensor.vdl_parkings_api_consecutive_failures
                name: Consecutive API failures

          - type: markdown
            title: Hinweise
            content: |
              - Die Parkhausdaten stammen aus der VDL-API.
              - Die Aktualisierungsintervalle werden pro Parkhaus in den Integrationsoptionen konfiguriert.
              - Ein API-Aufruf liefert die Daten aller Parkhäuser. Die individuellen Intervalle steuern, wann die jeweiligen Datensätze in Home Assistant aktualisiert werden.

