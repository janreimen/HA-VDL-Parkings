
name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate integration and repository files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      - name: Compile Python files
        run: |
          python -m compileall -q custom_components/vdl_parkings

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path(".").rglob("*.json"))

          if not files:
              raise SystemExit("No JSON files found.")

          for path in files:
              with path.open(encoding="utf-8") as file:
                  json.load(file)
              print(f"Valid JSON: {path}")

          PY

      - name: Validate YAML files
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          paths = [
              Path("dashboard/vdl_parkings.yaml"),
          ]

          for path in paths:
              if not path.exists():
                  print(f"Skipped missing file: {path}")
                  continue

              with path.open(encoding="utf-8") as file:
                  yaml.safe_load(file)

              print(f"Valid YAML: {path}")

          PY

      - name: Validate integration metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("custom_components/vdl_parkings/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          assert manifest["domain"] == "vdl_parkings"
          assert manifest["config_flow"] is True
          assert manifest["version"] == "0.1.4"

          print("Integration metadata is valid.")

          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Lovelace card JavaScript
        run: |
          node --check www/vdl-parkings-card.js

